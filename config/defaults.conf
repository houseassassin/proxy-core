# Proxy-Core Configuration
# Version: 2.1.1
# Author: houseassassin

# Directories
PROJECT_DIR="/opt/proxy-core"
WG_DIR="/etc/wireguard"
MTPROXY_DIR="/opt/MTProxy"
HYSTERIA_DIR="/etc/hysteria"
REMNAWAVE_DIR="/opt/remnawave"
NGINX_DIR="/etc/nginx"
CADDY_DIR="/etc/caddy"
HAPROXY_DIR="/etc/haproxy"

# Network Configuration
WG_SUBNET="10.0.0.0/24"
WG_SERVER_IP="10.0.0.1"
DNS_SERVERS="8.8.8.8,1.1.1.1"

# Port Ranges
WG_PORT_MIN=51820
WG_PORT_MAX=51900
MTPROXY_PORT_DEFAULT=8443
HYSTERIA_PORT_MIN=36712
HYSTERIA_PORT_MAX=36800
XRAY_PORT_MIN=10000
XRAY_PORT_MAX=10999

# SSL/TLS
SSL_CERT_DIR="/etc/ssl/proxy-core"
ACME_EMAIL=""
ACME_PROVIDER="letsencrypt"

# Logging
LOG_LEVEL="INFO"
LOG_RETENTION_DAYS=30
DEBUG=0

# Backup
BACKUP_DIR="/root/proxy-core-backups"
BACKUP_RETENTION_DAYS=7

# Docker
DOCKER_COMPOSE_VERSION="v2"

# Reverse Proxy Defaults
DEFAULT_REVERSE_PROXY="nginx"
ENABLE_HTTP2=true
ENABLE_HTTP3=false
ENABLE_BROTLI=true
ENABLE_GZIP=true

# Security
ENABLE_FAIL2BAN=true
ENABLE_UFW=true
SSH_PORT=22

# Performance
ENABLE_BBR=true
ENABLE_SWAP=true
SWAP_SIZE="2G"
